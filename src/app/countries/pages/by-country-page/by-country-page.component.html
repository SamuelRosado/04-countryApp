<h2>Search by Countries</h2>
<hr>


<div class="row">
  <div class="col">
    <app-shared-search-box
    (OnValue)="SearchByCountry($event)"
    [initialValue]="initialValue"
    placeholder="Buscar por pais"
    >
  </app-shared-search-box>
  </div>

  <div class="row">
    <div class="col">
      <hr>

      <app-shared-loading-spinner *ngIf="isloading"></app-shared-loading-spinner>

      <app-countries-country-table [countries]="country"></app-countries-country-table>

    </div>
  </div>
</div>
