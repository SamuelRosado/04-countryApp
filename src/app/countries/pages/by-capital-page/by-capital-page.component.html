
<h2>Search By Capital</h2>
<hr>


<div class="row">
  <div class="col">
    <app-shared-search-box
    (OnValue)="SearchByCapital($event)"
    placeholder="Buscar por capital"
    [initialValue]="initialValue"
    >
  </app-shared-search-box>
  </div>

  <div class="row">
    <div class="col">
      <hr>
        <app-shared-loading-spinner *ngIf="isLoading"></app-shared-loading-spinner>
        <app-countries-country-table [countries]="capitals"></app-countries-country-table>

    </div>
  </div>
</div>
